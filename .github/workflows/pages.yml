name: Publish site

# Runs after every Hub run (its commits use GITHUB_TOKEN, which does not trigger push workflows)
# and after human edits to the site. Deploys the current main; a failed or timed-out deployment
# fails this workflow visibly.
on:
  workflow_run:
    workflows: ['Hub']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hub-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
